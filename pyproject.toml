[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "anvil-mcmc"
version = "0.1.0.dev0"
description = "MCMC sampling engine optimized for Apple Silicon via MLX: thousands of parallel chains on the GPU, float64 anchoring on the CPU."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Kipping" }]
dependencies = [
    "mlx>=0.30",
    "numpy>=1.24",
]

[project.optional-dependencies]
test = ["pytest>=7", "emcee>=3.1"]

[tool.hatch.build.targets.wheel]
packages = ["anvil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running statistical tests (deselect with '-m \"not slow\"')",
]
