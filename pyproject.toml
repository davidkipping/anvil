[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "anvil/__init__.py"

[project]
name = "anvil-mcmc"
# the version lives in anvil/__init__.py (see [tool.hatch.version] below):
# one source of truth, because two drifted and a downstream package could
# not tell a stale install from a current one
dynamic = ["version"]
description = "MCMC sampling engine optimized for Apple Silicon via MLX: thousands of parallel chains on the GPU, float64 anchoring on the CPU."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "David Kipping" }]
dependencies = [
    "mlx>=0.30",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/davidkipping/anvil"
Documentation = "https://anvil-mcmc.readthedocs.io"
Repository = "https://github.com/davidkipping/anvil"
Changelog = "https://github.com/davidkipping/anvil/blob/main/VERSIONS.md"

[project.optional-dependencies]
test = ["pytest>=7", "emcee>=3.1"]
docs = ["sphinx>=7", "furo", "myst-parser", "numpy"]

[tool.hatch.build.targets.wheel]
packages = ["anvil"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running statistical tests (deselect with '-m \"not slow\"')",
]
