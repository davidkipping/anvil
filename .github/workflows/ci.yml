name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # arm64 Apple Silicon runner; MLX falls back to its CPU backend when
    # Metal is unavailable in the runner VM, so tests remain valid either way
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Fast tests
        run: python -m pytest -q -m "not slow"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install docs toolchain
        run: python -m pip install -r docs/requirements.txt
      - name: Build docs (warnings are errors)
        run: python -m sphinx -W -b html docs docs/_build/html
      - name: Upload rendered site
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
